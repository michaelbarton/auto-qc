[project]
name = "auto-qc"
description = "Run high-throughput automated quality control using configuration files."
authors = [{ name = "Michael Barton", email = "mail@michaelbarton.me.uk" }]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML",
    "click>=8.0.1",
    "pydantic>=2,<3",
    "rich>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/michaelbarton/auto-qc"
Repository = "https://github.com/michaelbarton/auto-qc"
Changelog = "https://github.com/michaelbarton/auto-qc/blob/master/CHANGELOG.md"

[project.scripts]
auto-qc = "auto_qc.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "auto_qc/version.py"

[tool.hatch.build.targets.wheel]
packages = ["auto_qc"]

[tool.hatch.build.targets.sdist]
include = ["auto_qc", "README.md", "LICENSE.txt", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pytest>=6.2.1",
    "scripttest>=1.3",
    "behave>=1.2.6,<1.3",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]  # isort-equivalent import sorting
