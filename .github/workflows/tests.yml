---
name: Unit and feature tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  TERM: xterm

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check auto_qc test features

      - name: Check formatting
        run: uv run ruff format --check auto_qc test features

      - name: Build package
        run: uv build

      - name: Run unit tests
        run: uv run pytest

      - name: Run feature tests
        run: uv run behave --stop

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check prettier formatting
        run: npx --yes prettier@2.2.1 --check .
